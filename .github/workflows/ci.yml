name: OmniForge CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration

permissions:
  contents: read

jobs:
  bootstrap-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Lint
        run: python scripts/validate_bootstrap.py --mode lint

      - name: Build validation
        run: python scripts/validate_bootstrap.py --mode build

      - name: Authority tests
        run: python scripts/validate_bootstrap.py --mode test

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: mypy
        run: python -m mypy src tests

      - name: Unit tests
        run: python -m pytest tests -v

      - name: Package build
        run: python -m build
